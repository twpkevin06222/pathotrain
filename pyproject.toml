[project]
name = "pathotrain"
version = "0.1.0"
description = "Training on whole slide images, built on patchology."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "twpkevin06222", email = "tengwaipokevin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dynamic-network-architectures>=0.4.4",
    "lightning-fabric>=2.6.6",
    "loguru>=0.7.3",
    "mlflow>=3.17.2",
    "numpy>=1.26",
    "optuna>=5.0.0",
    "patchology",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "segmentation-models-pytorch>=0.6.0",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "transformers>=4.57",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# CUDA 13.0 builds of torch and torchvision, not the PyPI default.
[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
