# Zero-shot SAM 3 nucleus segmentation and typing from text prompts, scored with PQ:
#   python -m pathotrain.cellseg.prompted prompted.yaml --split val    # choose the threshold
#   python -m pathotrain.cellseg.prompted prompted.yaml --split test   # report it
# Needs access to the gated facebook/sam3 (SAM License). Copy this file and set the paths.

name: cellseg-prompted

# One prompt per nucleus type (label: prompt), in your masks' label order (here the
# pannuke_split conversion's: neoplastic is label 5); or a single
# prompt, e.g. `prompts: cell`, for untyped nuclei (binary PQ only). On PanNuke, "cell"
# finds nuclei and "nucleus" almost nothing.
prompts:
  1: inflammatory cell
  2: connective tissue cell
  3: dead cell
  4: epithelial cell
  5: neoplastic cell
num_classes: 6              # types plus background
class_names: [background, inflammatory, connective, necrosis, epithelial, neoplastic]

thresholds: [0.4, 0.5, 0.6] # detection score thresholds, all scored in one pass
mask_threshold: 0.5
min_size: 10                # px a detection must keep after higher-scoring overlaps
batch_size: 8               # tiles per SAM 3 forward pass

data:
  val:
    images: /path/to/pannuke_split/val/images
    instances: /path/to/pannuke_split/val/inst_masks
    types: /path/to/pannuke_split/val/sem_masks
    image_prefix: img_
    instance_prefix: inst_
    type_prefix: sem_
    contours: true
  test:
    images: /path/to/pannuke_split/test/images
    instances: /path/to/pannuke_split/test/inst_masks
    types: /path/to/pannuke_split/test/sem_masks
    image_prefix: img_
    instance_prefix: inst_
    type_prefix: sem_
    contours: true
