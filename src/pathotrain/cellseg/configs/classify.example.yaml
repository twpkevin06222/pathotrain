# CellViT++ cell classifier: a head on the tokens of the cells a frozen CellViT detects.
#   python -m pathotrain.cellseg.classify classify.yaml
# Detected cells are paired with ground-truth cells by centroid distance and take their
# type; the head is scored on data.val's paired cells (val/balanced_acc, val/macro_f1,
# val/recall_<class>, ...). Copy this file and set the paths.

name: cellseg-classify
seed: 0
output_dir: runs/cellseg-classify
# mean/std are the detector's, from its checkpoint.

model:
  # A cellseg:cellvit instance model trained with pathotrain.cellseg.train (frozen).
  checkpoint: runs/cellseg-cellvit/checkpoints/best.ckpt
  num_classes: 5            # cell types without background (type t is class t - 1); the
                            # types of data's masks, which need not be the detector's
  head: {hidden: 100, dropout: 0.0}  # CellViT++'s MLP width; hidden: null for linear

match_radius: 15            # px between a detection's and a ground-truth cell's centroid

task:
  lr: 1.0e-3
  class_names: [inflammatory, connective, necrosis, epithelial, neoplastic]  # labels 1..5 of
  # the pannuke_split conversion (neoplastic is label 5); other conversions may differ

trainer:
  max_epochs: 50

features:                   # embedding the cells, once
  batch_size: 16            # tiles per batch
  num_workers: 8

loader:                     # training the head on the embeddings
  batch_size: 512
  num_workers: 0            # embeddings are in memory

data:
  train:
    images: /path/to/pannuke_split/train/images
    instances: /path/to/pannuke_split/train/inst_masks
    types: /path/to/pannuke_split/train/sem_masks
    image_prefix: img_
    instance_prefix: inst_
    type_prefix: sem_
    contours: true
  val:
    images: /path/to/pannuke_split/val/images
    instances: /path/to/pannuke_split/val/inst_masks
    types: /path/to/pannuke_split/val/sem_masks
    image_prefix: img_
    instance_prefix: inst_
    type_prefix: sem_
    contours: true
